<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Bill Payment Options</title>
  <link rel="stylesheet" th:href="@{/css/default.css}">
</head>
<body>
  <h3>Bill Payment Options</h3>
  <p>Enter an amount, select Debit Card or Credit Card, then click Pay.</p>
  <form th:action="@{/pay}" th:object="${paymentBean}" method="post">
    <p><label for="amt">Amount: $</label><input id="amt" type="text" th:field="*{value}" maxlength="15" required></p>
    <label>Options:</label>
    <label><input type="radio" th:field="*{paymentOption}" value="1">Debit Card</label>
    <label><input type="radio" th:field="*{paymentOption}" value="2">Credit Card</label>
    <p><button id="submit" type="submit">Pay</button></p>
    <div class="messagecolor" th:if="${#fields.hasErrors('value')}" th:errors="*{value}">Invalid value</div>
  </form>
  <form th:action="@{/reset}" method="post"><p><button type="submit">Reset</button></p></form>
</body>
</html>
