<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Decorated String Encoder</title><link rel="stylesheet" th:href="@{/css/default.css}"></head>
<body><h2>Decorated String Encoder</h2><p>Enter a string and an integer, then click Encode.</p>
<p>The coder bean will return a string that shifts the letters in the original string by the value you specify. The value must be between 0 and 26.</p>
<form id="encodeit" method="post" th:action="@{/encode}" th:object="${coderForm}"><p><label for="inputString">Enter a string: </label><input id="inputString" type="text" th:field="*{inputString}"> <label for="transVal">Enter the number of letters to shift by: </label><input id="transVal" type="number" min="0" max="26" th:field="*{transVal}"></p><p><button type="submit">Encode</button></p><p><label for="outputString">Result: </label><span id="outputString" style="color:blue" th:text="*{codedString}"></span></p><div class="messagecolor" th:if="${#fields.hasErrors('transVal')}" th:errors="*{transVal}" style="color:#d20005"></div></form>
<form method="post" th:action="@{/reset}"><p><button type="submit">Reset</button></p></form></body></html>
