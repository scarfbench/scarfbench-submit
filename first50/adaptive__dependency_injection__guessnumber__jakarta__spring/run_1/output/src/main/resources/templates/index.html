<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Guess My Number</title><link rel="stylesheet" th:href="@{/css/default.css}"></head><body><div id="container"><h2>Guess My Number</h2><p style="font-size:24px">I'm thinking of a number from <span style="color:blue" th:text="${minimum}">0</span> to <span style="color:blue" th:text="${maximum}">100</span>. You have <span style="color:blue" th:text="${remainingGuesses}">10</span> guesses.</p><form id="GuessMain" th:action="@{/guess}" th:object="${userNumberBean}" method="post"><label for="inputGuess">Number:</label><input id="inputGuess" type="number" th:field="*{userNumber}" th:disabled="${targetNumber == currentGuess or remainingGuesses &lt;= 0}"><button id="GuessButton" type="submit">Guess</button><span id="Higher" th:if="${message == 'Higher!'}">Higher!</span><span id="Lower" th:if="${message == 'Lower!'}">Lower!</span><span th:if="${message == 'Correct!'}">Correct!</span><div id="messages" th:if="${#fields.hasErrors('userNumber')}" th:errors="*{userNumber}">Invalid guess</div></form><form th:action="@{/reset}" method="post"><button id="RestartButton" type="submit">Reset</button></form></div></body></html>
